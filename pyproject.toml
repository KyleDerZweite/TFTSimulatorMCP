[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "tftmuzero-mcp"
version = "0.1.0"
description = "Local stdio MCP tools for the installed TFT simulator"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["mcp>=1.30,<2", "anyio>=4.5", "jsonschema>=4.20", "tft-simulator @ git+https://github.com/silverlight6/TFTMuZeroAgent.git@33c2c6eb873da1aaf319dc0c36bcbec1ad20c48d"]

[project.urls]
Repository = "https://github.com/KyleDerZweite/TFTMuZeroMCP"
"Original simulator" = "https://github.com/silverlight6/TFTMuZeroAgent"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tft-mcp = "tft_mcp.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
